name: Bindings

# Packs each BoltFFI binding of the engine and runs its smoke test via the root Makefile
# (`make test-bind-<lang>` = `make doctor-<lang>` + crates/engine/tests/bindings/run.sh).
# Language SDKs come from the official actions/setup-* actions where available; `make bind-<lang>`
# builds the rest from source (CPython and kotlinc).
on:
  push:
    branches: [main]
    paths:
      - "crates/engine/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - ".github/workflows/bindings.yml"
  pull_request:
    paths:
      - "crates/engine/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - ".github/workflows/bindings.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  bindings:
    name: ${{ matrix.lang }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lang: python, os: ubuntu-latest }
          - { lang: java, os: ubuntu-latest }
          # Android Kotlin bindings on the desktop JVM; the runner image ships the Android NDK
          - { lang: kotlin, os: ubuntu-latest }
          - { lang: dart, os: ubuntu-latest }
          # Xcode + Swift come preinstalled on macOS runners
          - { lang: swift, os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bindings-${{ matrix.lang }}

      # The CLI version comes from Cargo.toml ([workspace.dependencies] boltffi), so bumping
      # the dependency also changes this cache key and reinstalls the matching CLI.
      - name: Cache boltffi CLI
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/boltffi
          key: boltffi-cli-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml') }}
      - name: Install boltffi CLI
        run: make install-boltffi

      - if: matrix.lang == 'python'
        name: Install Python build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev libssl-dev libffi-dev libbz2-dev \
            libreadline-dev libsqlite3-dev liblzma-dev libzstd-dev
      - if: matrix.lang == 'python'
        name: Cache CPython build
        uses: actions/cache@v4
        with:
          path: .toolchains/python-3.15.2
          key: cpython-${{ runner.os }}-${{ runner.arch }}-3.15.2
      - if: matrix.lang == 'python'
        name: Build CPython
        run: make bind-python
      - if: matrix.lang == 'java' || matrix.lang == 'kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # The Ubuntu runner ships clang, but Java/Kotlin need it for the desktop JNI
      # link; install it explicitly so a runner image change cannot break the job.
      - if: matrix.lang == 'java' || matrix.lang == 'kotlin'
        name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Install kotlinc
        if: matrix.lang == 'kotlin'
        run: |
          if ! command -v kotlinc >/dev/null; then
            curl -fsSL -o "$RUNNER_TEMP/kotlinc.zip" \
              https://github.com/JetBrains/kotlin/releases/download/v2.2.20/kotlin-compiler-2.2.20.zip
            unzip -q "$RUNNER_TEMP/kotlinc.zip" -d "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
          fi
      - if: matrix.lang == 'dart'
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - if: matrix.lang == 'swift'
        name: Show Swift toolchain
        run: swift --version && xcodebuild -version

      - name: Run ${{ matrix.lang }} smoke test
        run: make test-bind-${{ matrix.lang }}
